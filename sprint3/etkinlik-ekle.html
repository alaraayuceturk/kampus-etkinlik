<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501005.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html">Etkinlikler</a></li>
                <li><a href="etkinlik-ekle.html">Ekle</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Etkinlik Ekle</h2>
        <p style="font-size: 0.9rem; color: #555;">Yıldızlı (*) alanlar zorunludur.</p>
        
        <form id="etkinlik-formu" novalidate>
            <div class="form-grup">
                <label for="ad">Etkinlik Adı *</label>
                <input type="text" id="ad" name="ad">
                <span id="ad-hata" class="hata-mesaji" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <div class="form-grup">
                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz</option>
                </select>
                <span id="kategori-hata" class="hata-mesaji" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <div class="form-grup">
                <label for="tarih">Tarih *</label>
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-mesaji" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <div class="form-grup">
                <label for="saat">Saat *</label>
                <input type="time" id="saat" name="saat">
                <span id="saat-hata" class="hata-mesaji" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <div class="form-grup">
                <label for="yer">Yer *</label>
                <input type="text" id="yer" name="yer">
                <span id="yer-hata" class="hata-mesaji" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <div class="form-grup">
                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan">
                <span id="kontenjan-hata" class="hata-mesaji" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <div class="form-grup">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
            </div>

            <button type="submit">Kaydet</button>
        </form>

        <div id="form-mesaj" style="margin-top: 1rem;"></div>
    </main>

    <footer>
        <p>Alara Yücetürk 2026</p>
    </footer>

</body>
</html>
