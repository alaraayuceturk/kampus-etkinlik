<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
</head>
<body>

    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="etkinlikler.html">Etkinlikler</a> |
            <a href="etkinlik-detay.html">Detay</a> |
            <a href="etkinlik-ekle.html">Ekle</a> |
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="etkinlikler.html" method="get">
            <p>
                <label for="etkinlik-sec"><strong>Güncellenecek Etkinliği Seçin:</strong></label><br>
                <select id="etkinlik-sec" name="etkinlik-sec" required>
                    <option value="tedx" selected>TEDxKampus: Sınırların Ötesinde Düşünmek</option>
                    <option value="biyomedikal">Biyomedikal Sinyal İşleme ve FFT Laboratuvarı</option>
                    <option value="radar">Otonom Araçlar ve Radar Algoritmaları</option>
                    <option value="fpga">Donanım Hızlandırma ve FPGA Hackathonu</option>
                    <option value="yapayzeka">Etik, Hukuk ve Üretken Yapay Zeka Paneli</option>
                </select>
            </p>

            <hr>

            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="İlham Konuşması / TEDx" selected>İlham Konuşması / TEDx</option>
                    <option value="Lab Çalıştayı">Lab Çalıştayı</option>
                    <option value="Teknik Seminer">Teknik Seminer</option>
                    <option value="Hackathon">Hackathon</option>
                    <option value="Panel">Panel</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih:</label><br>
                <input type="date" id="tarih" name="tarih" value="2026-10-18" required>
            </p>

            <p>
                <label for="saat">Saat:</label><br>
                <input type="time" id="saat" name="saat" value="13:00" required>
            </p>

            <p>
                <label for="yer">Yer:</label><br>
                <input type="text" id="yer" name="yer" value="Ana Kültür Merkezi - Kırmızı Salon" required>
            </p>

            <p>
                <label for="kontenjan">Kontenjan:</label><br>
                <input type="number" id="kontenjan" name="kontenjan" value="300" min="1" required>
            </p>

            <p>
                <label for="aciklama">Açıklama:</label><br>
                <textarea id="aciklama" name="aciklama" rows="5" cols="45" required>Farklı disiplinlerden gelen vizyoner liderlerin ilham veren yolculukları ve teknolojik dönüşümün geleceği.</textarea>
            </p>

            <p>
                <button type="submit">Güncelle</button>
            </p>
        </form>
    </main>

    <footer>
        <p>Alara Yücetürk 2026</p>
    </footer>

</body>
</html>
