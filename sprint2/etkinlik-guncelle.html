<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2416501005.css">
</head>
<body>

    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html">Etkinlikler</a></li>
                <li><a href="etkinlik-ekle.html">Ekle</a></li>
                <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Etkinlik Güncelle</h2>
        <form action="#" method="post">
            <div class="form-grup">
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" value="TEDxKampus: Sınırların Ötesinde Düşünmek" required>
            </div>

            <div class="form-grup">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="konusma" selected>İlham Konuşması</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="hackathon">Hackathon</option>
                    <option value="panel">Panel</option>
                </select>
            </div>

            <div class="form-grup">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" value="2026-10-18" required>
            </div>

            <div class="form-grup">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4">Farklı disiplinlerden gelen vizyoner liderlerin ilham veren yolculukları ve teknolojik dönüşümün geleceği.</textarea>
            </div>

            <button type="submit">Güncelle</button>
        </form>
    </main>

    <footer>
        <p>Alara Yücetürk 2026</p>
    </footer>

</body>
</html>
